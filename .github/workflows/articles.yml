# Pulls new Substack posts into education.html. When the list changes, the commit
# to main triggers the regular Cloudflare build, so new posts go live on their own.
name: Sync Substack articles

on:
  schedule:
    - cron: '17 13 * * *' # daily, ~8am Central
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: articles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm run articles

      - name: Commit if the list changed
        run: |
          if git diff --quiet -- education.html; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add education.html
          git commit -m "Sync Substack articles on education page"
          git push origin HEAD:main
